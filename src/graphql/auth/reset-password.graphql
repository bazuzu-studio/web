# graphql/mutations/reset-password.graphql
# token приходит из ссылки в письме (?token=...), которую Payload
# формирует сам после forgotPasswordUser.
mutation ResetPasswordUser($token: String!, $password: String!) {
  resetPasswordUser(token: $token, password: $password) {
    user {
      id
      name
      email
      roles
    }
    token
  }
}