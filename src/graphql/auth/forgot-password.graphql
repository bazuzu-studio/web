# graphql/mutations/forgot-password.graphql
# Payload генерирует эту мутацию автоматически для коллекции с auth: true.
# Всегда возвращает true, даже если email не найден — так пользователь
# не может через ответ узнать, зарегистрирован ли email (user enumeration).
mutation ForgotPasswordUser($email: String!) {
  forgotPasswordUser(email: $email)
}
