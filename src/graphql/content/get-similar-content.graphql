# Похожие: условия (жанры, тип, исключение самого тайтла и его франшизы)
# собираются в getSimilarContent (src/lib/api.ts).
query GetSimilarContent($where: Content_where, $limit: Int!, $sort: String) {
  Contents(where: $where, limit: $limit, sort: $sort) {
    docs {
      id
      type
      titleEn
      titleRu
      slug
      releaseYear
      rating
      poster {
        url
      }
      genres {
        id
        title
        slug
      }
      ageRating
      releaseStatus
    }
  }
}
