# src/graphql/contents/GetContentBySlug.graphql
# Сезоны и серии здесь НЕ запрашиваются: getContentBySlug (src/lib/api.ts)
# берёт их отдельным запросом GetSeasonsByContentIds сразу по всей франшизе.
query GetContentBySlug($slug: String!) {
  Contents(where: { slug: { equals: $slug } }, limit: 1) {
    docs {
      id
      type
      titleEn
      titleRu
      originalTitle
      slug
      description
      releaseYear
      kinopoiskId
      franchiseId
      duration
      rating

      poster {
        url
      }
      backdrop {
        url
      }
      genres {
        id
        title
        slug
      }
      ageRating
      releaseStatus
      playerLink
    }
  }
}
