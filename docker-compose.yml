# Dokploy → Compose. Домен настраивается во вкладке Domains:
#   Host otakuum.ru (и www), Service Name web, Port 3000, HTTPS + Let's Encrypt.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # вшиваются в клиентский бандл при сборке
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:?set NEXT_PUBLIC_GRAPHQL_API_URL}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://s3.otakuum.ru/media}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # адрес GraphQL для серверных запросов (SSR). По умолчанию — тот же публичный,
      # можно указать внутренний адрес CMS в сети dokploy-network.
      GRAPHQL_API_URL: ${GRAPHQL_API_URL:-${NEXT_PUBLIC_GRAPHQL_API_URL}}
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
